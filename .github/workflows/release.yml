name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Python ${{ matrix.python-version }} release tests
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check src tests

      - name: Run test suite
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests

  windows-release:
    name: Build and publish Windows release
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches project version
        id: project_version
        shell: pwsh
        run: |
          $match = Select-String -Path pyproject.toml -Pattern '^version = "([^"]+)"$'
          if (-not $match) { throw "Could not read project version from pyproject.toml" }
          $version = $match.Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}"

          if ($tag -ne "v$version") { throw "Tag $tag does not match project version $version" }
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pyinstaller

      - name: Build Windows EXE and portable ZIP
        run: python tools/package_windows_release.py

      - name: Build source ZIP
        run: python tools/package_source_release.py

      - name: Verify release artifacts
        run: python tools/verify_release_artifacts.py

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: EditorBinder ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/EditorBinder-${{ steps.project_version.outputs.version }}-win-x64.exe
            dist/EditorBinder-${{ steps.project_version.outputs.version }}-win-x64.zip
            dist/EditorBinder-source-${{ steps.project_version.outputs.version }}.zip
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
